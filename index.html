<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cement Job" />
<meta name="theme-color" content="#f2f2f7" />
<title>Cement Job</title>
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  /* Light, grouped-list look. Change these values and the whole app follows. */
  :root {
    --bg:#f2f2f7; --card:#ffffff; --line:#e5e5ea; --ink:#111114; --sub:#6c6c72; --faint:#a1a1a8;
    --field:#e9e9ee; --accent:#a5511f; --accent-bg:#fdf0e4; --accent-ink:#7c3a12;
    --danger:#c62828; --danger-bg:#fdecec; --danger-edge:#f4c7c7; --good:#1b7a4a; --good-bg:#e7f6ee;
    --lead:#d97706; --tail:#0f8a7e; --track:#7c3aed; --rat:#db2777; --disp:#2563eb;
    --r:14px;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow-x:hidden; background:var(--bg); color:var(--ink);
    -webkit-text-size-adjust:100%; font-family:var(--font); }
  body, input, select, button { font-variant-numeric: tabular-nums; }
  input, select, button { font-family: inherit; color:var(--ink); }
  input::placeholder { color:var(--faint); }
  #root { min-height:100vh; }

  .page { max-width:600px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 110px); }
  .top { position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line); }
  .top button { background:none; border:none; color:var(--accent); font-size:17px; cursor:pointer; display:flex; align-items:center; gap:4px; padding:4px; }
  .top button b { font-size:24px; font-weight:400; line-height:1; margin-top:-2px; }
  .title { font-size:34px; font-weight:800; letter-spacing:-.02em; margin:18px 0 4px; line-height:1.1; word-break:break-word; }
  .lede { color:var(--sub); font-size:15px; margin:0 0 6px; }

  .sec { margin-top:24px; }
  .sh { display:flex; align-items:flex-end; gap:8px; font-size:13px; font-weight:600; color:var(--sub); text-transform:uppercase;
    letter-spacing:.05em; padding:0 16px 7px; }
  .sh span { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; }
  .grp { background:var(--card); border-radius:var(--r); padding:0 16px; }
  .pad { padding:12px 0; }
  .r { display:flex; align-items:center; gap:12px; min-height:56px; padding:7px 0; border-bottom:1px solid var(--line); }
  .grp > .r:last-child, .grp > :last-child .r:last-child { border-bottom:none; }
  .r .l { flex:1; min-width:0; font-size:16px; }
  .r .l i { font-style:normal; color:var(--faint); font-size:14px; }
  .in { width:44%; max-width:200px; text-align:right; background:var(--field); border:2px solid transparent; border-radius:10px;
    padding:10px 12px; font-size:17px; min-width:0; -webkit-appearance:none; appearance:none; }
  .in:focus { outline:none; border-color:var(--accent); background:#fff; }
  .chip { background:var(--accent-bg); color:var(--accent); border:none; border-radius:10px; padding:10px 30px 10px 12px; font-size:16px;
    font-weight:600; max-width:60%; -webkit-appearance:none; appearance:none; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
  .chip:focus { outline:2px solid var(--accent); }
  .wide { width:100%; text-align:left; max-width:none; }

  .seg { display:flex; background:#e3e3e8; border-radius:11px; padding:3px; gap:3px; margin:12px 0; }
  .seg button { flex:1; border:none; background:transparent; color:var(--ink); padding:10px 6px; border-radius:9px; font-size:15px; font-weight:500; cursor:pointer; }
  .seg button.on { background:#fff; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.14); }
  .pill { border-radius:999px; padding:7px 15px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--sub); }
  .pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; white-space:nowrap; }
  .btn.sec2 { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.ghost { background:transparent; border:1.5px dashed #c7c7cc; color:var(--sub); width:100%; margin:4px 0 12px; }
  .btn.danger { background:var(--danger-bg); color:var(--danger); }
  .x { width:40px; height:40px; flex:0 0 40px; background:var(--danger-bg); border:1px solid var(--danger-edge); color:var(--danger); border-radius:10px; cursor:pointer; font-size:14px; }
  .bar2 { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .bar2 .btn { flex:1 1 auto; }

  .item { display:flex; align-items:center; gap:13px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; width:100%;
    background:none; border-left:none; border-right:none; border-top:none; text-align:left; font-size:16px; }
  .grp > .item:last-child { border-bottom:none; }
  .item .ic { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:17px; }
  .item .nm { display:block; font-size:17px; font-weight:500; }
  .item .sb { display:block; font-size:14px; color:var(--sub); margin-top:2px; }
  .item .ch { margin-left:auto; color:#c4c4c8; font-size:24px; font-weight:300; }

  .note { font-size:13px; color:var(--sub); margin:6px 0 0; line-height:1.45; }
  .warn { background:var(--danger-bg); border:1px solid var(--danger-edge); border-radius:12px; padding:12px 14px; margin-top:14px; color:var(--danger); font-size:14px; line-height:1.45; }
  .ok { background:var(--good-bg); border-radius:12px; padding:12px 14px; margin-top:10px; color:var(--good); font-size:14px; }
  .empty { text-align:center; color:var(--faint); padding:22px 0; font-size:15px; }

  .line { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .line .k { font-size:15px; display:flex; align-items:center; gap:11px; min-width:0; }
  .line .k small { display:block; font-size:13px; color:var(--sub); margin-top:2px; }
  .line .v { font-size:16px; font-weight:700; white-space:nowrap; }
  .num { width:28px; height:28px; border-radius:99px; color:#fff; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tag { font-size:15px; font-weight:700; margin:12px 0 0; display:flex; align-items:center; gap:7px; }
  .tag::before { content:""; width:12px; height:12px; border-radius:3px; background:currentColor; }
  .sum { display:flex; justify-content:space-between; padding:12px 0 4px; font-weight:700; font-size:15px; border-top:2px solid var(--line); }
  .big { border-radius:13px; padding:17px 16px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; background:var(--accent-bg); }
  .big .k { font-size:17px; font-weight:600; color:var(--accent-ink); }
  .big .v { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .big .v small { font-size:16px; font-weight:700; margin-left:3px; }
  .big.blue { background:#e8f0fd; } .big.blue .k { color:#1e4fa8; }
  .tiles { display:flex; gap:8px; margin:12px 0 6px; }
  .tile { flex:1; min-width:0; background:var(--bg); border-radius:12px; padding:11px 12px; }
  .tile .k { font-size:13px; color:var(--sub); font-weight:500; }
  .tile .v { font-size:22px; font-weight:800; margin-top:3px; letter-spacing:-.01em; }
  .tile .v small { font-size:12px; color:var(--sub); font-weight:600; margin-left:3px; }

  .add { padding:10px 0; border-bottom:1px solid var(--line); }
  .add .in { width:100%; max-width:none; text-align:left; font-size:16px; }
  .add .rw { display:flex; gap:7px; align-items:center; margin-top:7px; }
  .add .rw .in { flex:1; text-align:left; padding:10px; }
  .add .rw .chip { flex:1; max-width:none; font-size:15px; padding-right:26px; }
  .add .amt { flex:1.1; text-align:right; font-weight:700; font-size:15px; white-space:nowrap; }

  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); font-weight:600; padding:8px 4px; border-bottom:1px solid var(--line); }
  table.t td { padding:9px 4px; border-bottom:1px solid var(--line); }
  table.t tr:last-child td { border-bottom:none; }
  table.t td.n, table.t th.n { text-align:right; white-space:nowrap; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:90; display:flex; background:rgba(249,249,251,.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border-top:1px solid #dcdce0; padding:6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  .tabs button { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:#8e8e93; font-size:12px; font-weight:500; cursor:pointer; padding:4px 0; }
  .tabs button.on { color:var(--accent); font-weight:600; }
  .tabs svg { width:28px; height:28px; }

  .foot { text-align:center; margin-top:34px; }
  .foot .nm { font-size:16px; font-weight:700; }
  .foot .ro { font-size:13px; color:var(--sub); margin-top:2px; }
  .foot a { display:inline-block; margin-top:6px; font-size:15px; color:var(--accent); text-decoration:none; }
  .linkbtn { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; margin-top:8px; }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 86px); transform:translateX(-50%); z-index:9999;
    background:#1c1c1e; color:#fff; font-size:15px; font-weight:500; padding:11px 20px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.25); white-space:nowrap; }

  .more { width:38px; height:38px; flex:0 0 38px; border-radius:99px; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:22px; font-weight:700; letter-spacing:1px; cursor:pointer; margin-left:auto; }
  .more:active { background:var(--field); }
  .more + .ch { margin-left:0; }
  .modal { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.38); display:flex; align-items:flex-end; justify-content:center;
    padding:0 10px calc(env(safe-area-inset-bottom) + 10px); animation:fade .15s ease-out; }
  .modal.mid { align-items:center; padding:20px; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .sheetbox { width:100%; max-width:480px; }
  .sheetbox .grpm { background:rgba(255,255,255,.98); border-radius:14px; overflow:hidden; margin-bottom:8px; }
  .sheetbox .hdm { padding:13px 16px; text-align:center; font-size:13px; color:var(--sub); border-bottom:1px solid var(--line); }
  .sheetbox button { display:block; width:100%; background:none; border:none; border-bottom:1px solid var(--line); padding:17px; font-size:19px; color:#0a64d6; cursor:pointer; }
  .sheetbox button:last-child { border-bottom:none; }
  .sheetbox button.dg { color:var(--danger); } .sheetbox button.cx { font-weight:600; }
  .dlg { width:100%; max-width:340px; background:#fff; border-radius:16px; overflow:hidden; text-align:center; }
  .dlg .bd { padding:20px 18px 16px; }
  .dlg h4 { margin:0 0 6px; font-size:17px; } .dlg p { margin:0; font-size:14px; color:var(--sub); line-height:1.4; }
  .dlg .in { width:100%; max-width:none; text-align:left; margin-top:10px; font-size:16px; }
  .dlg .bt { display:flex; border-top:1px solid var(--line); }
  .dlg .bt button { flex:1; background:none; border:none; padding:14px; font-size:17px; color:#0a64d6; cursor:pointer; }
  .dlg .bt button + button { border-left:1px solid var(--line); font-weight:600; }
  .dlg .bt button.dg { color:var(--danger); }

  .ccrow { display:flex; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
  .grp > .ccrow:last-child { border-bottom:none; }
  .cc { flex:1; min-width:0; display:block; border:1.5px solid var(--line); border-radius:12px; padding:9px 11px 6px; background:var(--bg); }
  .cc .ct { display:flex; gap:6px; font-size:13px; color:var(--sub); }
  .cc .ct b { margin-left:auto; font-weight:600; color:var(--faint); font-size:12px; }
  .cc input { width:100%; border:none; background:none; font-size:20px; font-weight:600; padding:6px 0 2px; }
  .cc input:focus { outline:none; }
  .cc input::placeholder { color:var(--ink); opacity:.55; }
  .cc.ed { border-color:var(--good); background:#fff; } .cc.ed .ct b { color:var(--good); }
  .pchips { display:flex; flex-wrap:wrap; gap:7px; padding:10px 0 4px; }
  .pchip { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font-size:14px; font-weight:600; cursor:pointer; }
  .pchip:active { background:var(--accent-bg); }

  .tag.plain::before { display:none; }
  .brand { display:flex; align-items:center; gap:12px; margin-top:6px; }
  .brand img { height:46px; width:auto; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.2em; color:var(--accent); }
  .foot2 { text-align:center; margin-top:40px; font-size:12.5px; color:var(--sub); line-height:1.6; }
  .foot2 a { color:var(--sub); text-decoration:none; letter-spacing:.04em; }

  /* Printable worksheet */
  #sheet { display:none; background:#fff; color:#141a17; min-height:100vh; }
  body.sheet #root { display:none; }
  body.sheet #sheet { display:block; }
  #sheet .tb { position:sticky; top:0; display:flex; gap:8px; align-items:center; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    border-bottom:1px solid #e5e7e2; background:#f6f7f5; }
  #sheet .tb button { background:#fff; border:1px solid #e5e7e2; border-radius:10px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer; color:#141a17; }
  #sheet .tb .pr { margin-left:auto; background:var(--accent); color:#fff; border:none; }
  #sheet .doc { max-width:760px; margin:0 auto; padding:16px 14px 60px; font-size:10.5px; line-height:1.38; }
  #sheet h1 { font-size:17px; margin:0; } #sheet .sub { color:#6b7770; font-weight:400; }
  #sheet .hd { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #141a17; padding-bottom:5px; margin-bottom:8px; }
  #sheet .meta { text-align:right; font-size:9.5px; color:#444; }
  #sheet .cols { display:flex; gap:14px; align-items:flex-start; }
  #sheet .left { width:170px; flex-shrink:0; } #sheet .right { flex:1; min-width:0; }
  #sheet h2 { font-size:11.5px; color:var(--accent); margin:9px 0 3px; border-bottom:1px solid #eedccf; padding-bottom:2px; }
  #sheet table { width:100%; border-collapse:collapse; margin:2px 0 4px; }
  #sheet td, #sheet th { text-align:left; padding:2.5px 5px; border-bottom:1px solid #eee; vertical-align:top; }
  #sheet th { background:#f4f5f3; font-size:8.5px; text-transform:uppercase; letter-spacing:.3px; color:#666; }
  #sheet td.f { font-family:var(--mono); color:#666; font-size:9px; }
  #sheet td.r { text-align:right; font-family:var(--mono); font-weight:700; white-space:nowrap; }
  #sheet .tot td { background:#5a2a10; color:#fff; font-weight:700; border:none; }
  #sheet .totd td { background:#12233d; color:#fff; font-weight:700; border:none; }
  #sheet .fn { font-size:8.5px; color:#888; border-top:1px solid #ddd; padding-top:4px; margin-top:10px; }
  @media (max-width:600px){ #sheet .cols { flex-direction:column; } #sheet .left { width:100%; max-width:240px; } }
  @media print {
    @page { size:A4; margin:10mm; }
    #sheet .tb { display:none !important; }
    #sheet .doc { padding:0; max-width:none; }
    #sheet .cols { flex-direction:row; } #sheet .left { width:170px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet"></div>
<script>
(function () {
"use strict";

/* ───────────────────────── storage & numbers ───────────────────────── */
// Everything lives on the phone. Every access is guarded: a private
// window or a locked-down browser must still run the calculator.
var NS = "cmt3.";
function load(k, d) { try { var v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function P(v) { if (v === "" || v == null) return null; var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function fx(v, n) { return v == null || !isFinite(v) ? "—" : Number(v).toFixed(n == null ? 2 : n); }
function fi(v) { return v == null || !isFinite(v) ? "—" : Math.round(v).toLocaleString("en-US"); }
function de(v) { return v == null ? "—" : Number.isInteger(v) ? String(v) : v.toFixed(1); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function frac(od) {
  var w = Math.floor(od + 1e-9), r = od - w, map = { 0: "", 0.125: "⅛", 0.25: "¼", 0.375: "⅜", 0.5: "½", 0.625: "⅝", 0.75: "¾", 0.875: "⅞" };
  var key = Math.round(r * 8) / 8; return w + (map[key] != null ? map[key] : r.toFixed(3).slice(1)) + "″";
}

/* ───────────────────────── rig spec-sheet capacities (L/m) ───────────────────────── */
// Same tables as the field cement sheet: capacities come from the spec
// sheet first; anything not in a table falls back to 0.5067 × (D² − d²).
var CSG = [
  { id: "c1338", label: "13⅜″", od: 13.375, idIn: 12.615, cap: 80.63 },
  { id: "c958", label: "9⅝″", od: 9.625, idIn: 8.681, cap: 39.55 },
  { id: "c7_23", label: "7″ · 23", od: 7, idIn: 6.366, cap: 20.53 },
  { id: "c7_29", label: "7″ · 29", od: 7, idIn: 6.184, cap: 19.4 },
  { id: "c412", label: "4½″", od: 4.5, idIn: 4, cap: 8.11 }
];
var HOLE = [
  { id: "h16", label: "16″", d: 16, cap: 129.7 },
  { id: "h1712", label: "17½″", d: 17.5, cap: 155.2 },
  { id: "h1214", label: "12¼″", d: 12.25, cap: 76.04 },
  { id: "h812", label: "8½″", d: 8.5, cap: 36.61 },
  { id: "h618", label: "6⅛″", d: 6.125, cap: 19 }
];
var DP = [
  { id: "dc814", label: "8¼″ DC", cap: 4 }, { id: "dc612", label: "6½″ DC", cap: 4 },
  { id: "dp5n", label: "5″ DP (New)", cap: 9 }, { id: "dp5p", label: "5″ DP (Premium)", cap: 9.2 }, { id: "hwdp5", label: "5″ HWDP", cap: 4.6 },
  { id: "dc434", label: "4¾″ DC", cap: 2.6 }, { id: "dp4n", label: "4″ DP (New)", cap: 5.2 }, { id: "dp4p", label: "4″ DP (Premium)", cap: 5.3 }, { id: "hwdp4", label: "4″ HWDP", cap: 3.3 }
];
var OH_ANN = { h16: { c1338: 39.1 }, h1214: { c958: 28.94 }, h812: { c7_23: 11.71, c7_29: 11.71 }, h618: { c412: 8.7 } };
var CC_ANN = { c1338: { c958: 33.53 }, c958: { c7_23: 14.65, c7_29: 14.65 }, c7_23: { c412: 10.23 }, c7_29: { c412: 9.12 } };
function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }
function ohAnn(hId, cId) {
  if (OH_ANN[hId] && OH_ANN[hId][cId] != null) return { v: OH_ANN[hId][cId], src: "table" };
  var h = byId(HOLE, hId), c = byId(CSG, cId); if (!h || !c) return null;
  var v = 0.5067 * (h.d * h.d - c.od * c.od); return v > 0 ? { v: v, src: "calc" } : { v: null, bad: true };
}
function ccAnn(pId, cId) {
  if (CC_ANN[pId] && CC_ANN[pId][cId] != null) return { v: CC_ANN[pId][cId], src: "table" };
  var p = byId(CSG, pId), c = byId(CSG, cId); if (!p || !c) return null;

var PRESETS = [{ name: "WSW", unit: "L" }, { name: "CDF-1", unit: "L" }, { name: "CX-1", unit: "kg" }, { name: "Bentonite", unit: "kg" }, { name: "FL-45", unit: "L" }, { name: "CSS-1", unit: "kg" }];
// Remembers every additive typed (name, factor, unit) so it comes back as a one-tap chip.
function learnAdds(j) {
  var lib = load("addLib", {}), ch = false;
  [["leadAdd", ""], ["tailAdd", ""], ["spacerAdd", "S:"]].forEach(function (g) {
    (j[g[0]] || []).forEach(function (r) {
      var nm = (r.name || "").trim(); if (!nm) return;
      var v = { unit: r.unit, factor: r.factor };
      if (JSON.stringify(lib[g[1] + nm]) !== JSON.stringify(v)) { lib[g[1] + nm] = v; ch = true; }
    });
  });
  if (ch) save("addLib", lib);
}
function chipList(key, rows) {
  var sp = key === "spacerAdd", lib = load("addLib", {}), have = {}, out = [];
  rows.forEach(function (r) { have[(r.name || "").trim().toLowerCase()] = 1; });
  var push = function (nm, d) { if (!have[nm.toLowerCase()]) { have[nm.toLowerCase()] = 1; out.push({ name: nm, d: d }); } };
  Object.keys(lib).forEach(function (k) { if ((k.indexOf("S:") === 0) === sp) push(sp ? k.slice(2) : k, lib[k]); });
  if (!sp) PRESETS.forEach(function (p) { push(p.name, { unit: p.unit, factor: "" }); });
  return out;
}
function addRows(title, key, rows, baseLabel, color) {
  var units = [["kg", "kg"], ["L", "L"], ["m3", "m³"], ["MT", "MT"]];
  var h = '<div class="tag plain" style="color:var(--ink)">' + title + ' <span style="font-weight:500;color:var(--sub)" data-base="' + key + '">· × ' + baseLabel + "</span></div>";
  var chips = chipList(key, rows);
  if (chips.length) h += '<div class="pchips">' + chips.map(function (c) { return '<button class="pchip" data-act="addPre" data-i="' + esc(key + "|" + c.name) + '">+ ' + esc(c.name) + "</button>"; }).join("") + "</div>";
  h += '<p class="note">Factor is kg or L per ' + baseLabel + ". Picking m³ or MT only divides the answer by 1,000.</p>";
  rows.forEach(function (r, i) {
    var p = key + "." + i + ".";
    h += '<div class="add"><input class="in" data-k="' + p + 'name" value="' + esc(r.name) + '" placeholder="name">' +
      '<div class="rw"><input class="in" inputmode="decimal" data-k="' + p + 'factor" value="' + esc(r.factor) + '" placeholder="factor">' +
      '<select class="chip" data-k="' + p + 'unit">' + units.map(function (u) { return '<option value="' + u[0] + '"' + (r.unit === u[0] ? " selected" : "") + ">" + u[1] + "</option>"; }).join("") + "</select>" +
      '<span class="amt" data-out="' + key + "." + i + '" style="color:' + color + '">—</span>' +
      '<button class="x" data-act="delAdd" data-i="' + key + "." + i + '">✕</button></div></div>';
  });
  return h + '<button class="btn ghost" data-act="addAdd" data-i="' + key + '">+ additive</button>';
}

/* ───────────────────────── cement page ───────────────────────── */
function CementPage(root, s) {
  function persist() { touch(s); }
  root.addEventListener("change", function () { learnAdds(s); });
  function opt(list) { return list.map(function (x) { return { id: x.id, label: x.label }; }); }
  function draw() {
    var lt = s.scheme === "leadtail", liner = s.jobType === "liner", k = caps(s), c = byId(CSG, s.csgId), h = byId(HOLE, s.holeId), pc = byId(CSG, s.prevId);
    var o = '<h1 class="title" id="o-title">' + esc(s.name) + '</h1><p class="lede">Cement job · ' + when(s.created) + "</p>";
    o += '<div class="bar2"><button class="btn" data-act="pdf">PDF sheet</button><button class="btn sec2" data-act="dup">Duplicate</button><button class="btn danger" data-act="del">Delete</button></div>';
    o += '<div id="warnBox"></div>';
    o += grp("Job type", '<div class="pad" style="padding-top:0">' + seg("jobType", s, [["casing", "Casing · surface"], ["liner", "Liner · hung"]]) + seg("scheme", s, [["single", "Single slurry"], ["leadtail", "Lead / Tail"]]) + "</div>");
    o += grp("Previous casing", s.prevOn ?
      sel("Size", "prevId", s, opt(CSG), true) + num("Shoe depth", "prevShoe", s, "m") +
      '<div class="ccrow">' + capCard("Csg-Csg ann (" + pc.label + "×" + c.label + ")", "capCC", s, k.auto.cc) + "</div>" :
      '<p class="note" style="padding:14px 0;margin:0">Open hole from surface. Tap “none” to add if TOC lands inside a previous casing.</p>',
      '<button class="pill' + (s.prevOn ? " on" : "") + '" data-act="prev">' + (s.prevOn ? "present ✓" : "none") + "</button>");
    o += grp(liner ? "Liner (being cemented)" : "Casing (being cemented)",
      sel("Size", "csgId", s, opt(CSG), true) + (liner ? num("Liner top", "top", s, "m") : "") + num("Shoe depth", "shoe", s, "m") + num("Float collar", "fc", s, "m") +
      (liner ? sel("Running string", "dpTub", s, opt(DP), true) : "") +
      '<div class="ccrow">' + capCard("Internal", "capInt", s, k.auto.int) + capCard("OH ann (" + h.label + "×" + c.label + ")", "capOH", s, k.auto.oh) + "</div>");
    if (k.ohBad || k.ccBad) o += '<div class="warn">⚠ Impossible geometry: the casing OD (' + c.label + ") is larger than the " + (k.ohBad ? "hole (" + h.label + ")" : "previous casing (" + pc.label + ")") + ". Pick a bigger hole/casing — e.g. 9⅝″ needs a 12¼″ hole, 7″ needs 8½″.</div>";
    o += grp("Open hole", sel("Size", "holeId", s, opt(HOLE), true) + num("TD", "td", s, "m") + '<div class="ccrow">' + capCard("Full bore (" + h.label + ")", "capFull", s, k.auto.full) + "</div>");
    o += grp("Cement program", num(lt ? "TOC — Lead" : "TOC", "toc", s, "m") + (lt ? num("Top of Tail", "tailTop", s, "m") : "") +
      '<div class="tag" style="color:var(--lead)">Lead excess</div>' + num("Lead OH", "exLeadOH", s, "%", "25") + num("Lead Cased", "exLeadCsg", s, "%", "10") +
      '<div class="tag" style="color:var(--tail)">Tail excess</div>' + num("Tail OH", "exTailOH", s, "%", "25") + num("Tail Cased", "exTailCsg", s, "%", "0") +
      '<p class="note" style="padding-bottom:12px">Matches proposal: Lead/Tail × OH/Cased. Pocket follows Tail OH. Shoe track has no excess.</p>');
    o += '<div id="schSec" style="display:none">' + grp("Schematic", '<div class="pad" id="o-sch"></div>', "bottom expanded · not to scale") + "</div>";
    o += grp("Cement volumes", '<div id="o-vol"></div>');
    o += grp("Displacement", '<div id="o-disp"></div>' + num("Pump", "outStk", s, "L/stk") + '<div id="o-stk"></div>');
    if (lt) o += grp("Lead slurry", '<div class="pad" style="padding-bottom:0" id="o-lv"></div>' + num("Slurry yield", "leadYield", s, "m³/MT") + num("Mix fluid conc", "leadConc", s) + num("Dead volume", "leadDead", s, "m³") +
      '<div id="o-lead"></div>' + addRows("Lead additives", "leadAdd", s.leadAdd, "Equiv dry", "var(--lead)"));
    o += grp(lt ? "Tail slurry" : "Cement slurry", '<div class="pad" style="padding-bottom:0" id="o-tv"></div>' + num("Slurry yield", "tailYield", s, "m³/MT") + num("Mix fluid conc", "tailConc", s) + num("Dead volume", "tailDead", s, "m³") +
      '<div id="o-tail"></div>' + addRows(lt ? "Tail additives" : "Additives", "tailAdd", s.tailAdd, "Dry cement", "var(--tail)"));
    o += grp("Spacer", num("Pumped volume", "spacerVol", s, "m³") + num("Dead volume", "spacerDead", s, "m³") + '<div id="o-sp"></div>' +
      addRows("Spacer additives", "spacerAdd", s.spacerAdd, "Mix vol", "var(--disp)"));
    root.innerHTML = '<div class="page">' + o + "</div>";
    outs();
  }
  function outs() {
    var m = model(s), sl = slurries(s, m), $ = function (id) { return root.querySelector("#" + id); };
    $("o-title").textContent = s.name;
    $("warnBox").innerHTML = m && m.warn.length ? '<div class="warn">⚠ ' + m.warn.map(esc).join("<br>⚠ ") + "</div>" : "";
    root.querySelectorAll("[data-cc]").forEach(function (el) {
      var ed = P(s[el.getAttribute("data-cc")]) != null; el.classList.toggle("ed", ed); el.querySelector("b").textContent = ed ? "edited" : "auto";
    });
    // The drawing shows up once the well is filled in.
    var ok = m && m.items.length;
    $("schSec").style.display = ok ? "" : "none";
    if (ok) $("o-sch").innerHTML = schematic(m, true);
    var col = { lead: "var(--lead)", tail: "var(--tail)", shoetrack: "var(--track)", rathole: "var(--rat)" };
    if (ok) {
      var block = function (title, color, filt, tot) {
        var g = '<div class="tag" style="color:' + color + '">' + title + "</div>";
        m.items.filter(filt).forEach(function (z) {
          g += '<div class="line"><span class="k"><span class="num" style="background:' + col[z.slurry] + '">' + z.n + "</span><span>" + esc(z.label) +
            "<small>" + fx(z.dBot - z.dTop, 1) + " m × " + fx(z.cap) + " L/m" + (z.ex > 0 ? " +" + fi(z.ex * 100) + "%" : "") + '</small></span></span><span class="v">' + fx(z.vol / 1000) + " m³</span></div>";
        });
        return g + '<div class="sum" style="color:' + color + '"><span>' + (title === "Slurry" ? "Slurry" : title) + ' volume</span><span>' + fx(tot / 1000) + " m³</span></div>";
      };
      var v = "";
      if (m.hasLead) v += block("Lead", "var(--lead)", function (z) { return z.slurry === "lead"; }, m.leadVol);
      v += block(m.hasLead ? "Tail" : "Slurry", "var(--tail)", function (z) { return z.slurry !== "lead"; }, m.tailVol);
      $("o-vol").innerHTML = v + big("Total Cement", fx(m.total / 1000), " m³");
    } else $("o-vol").innerHTML = '<div class="empty">Enter data above</div>';
    if (m && m.dispL != null) {
      $("o-disp").innerHTML = m.parts.map(function (p) { return line(esc(p.t), fx(p.v / 1000) + " m³"); }).join("") + big("Displacement volume", fx(m.dispL / 1000), " m³", "blue");
      var po = P(s.outStk);
      $("o-stk").innerHTML = '<div class="tiles" style="margin-bottom:14px">' + tile("Strokes", po ? fi(m.dispL / po) : "—", "stk") + tile("Volume", fx(m.dispL / 1000 * 6.28981, 1), "bbl") + "</div>";
    } else { $("o-disp").innerHTML = '<div class="empty">—</div>'; $("o-stk").innerHTML = ""; }
    var vol = function (V) { return '<span style="color:var(--sub);font-size:14px">Volume ' + fx(V) + " m³</span>"; };
    var tiles = function (o) {
      return '<div class="tiles">' + tile("Dry cement", o ? fx(o.dry) : "—", "MT") + tile("Mix fluid", o ? fx(o.mix) : "—", "m³") + tile("Equiv dry", o ? fx(o.equiv) : "—", "MT") + "</div>";
    };
    var amts = function (key, rows, base) {
      rows.forEach(function (r, i) { var el = root.querySelector('[data-out="' + key + "." + i + '"]'); if (el) { var a = addVal(r, base); el.textContent = a != null ? addFmt(a, r.unit) + " " + unitLabel(r.unit) : "—"; } });
      var b = root.querySelector('[data-base="' + key + '"]'); if (b) b.textContent = "· × " + { leadAdd: "Equiv dry", tailAdd: "Dry cement", spacerAdd: "Mix vol" }[key] + (base != null ? " (" + fx(base) + ")" : "");
    };
    if ($("o-lead")) { $("o-lv").innerHTML = vol(m ? m.leadVol / 1000 : null); $("o-lead").innerHTML = tiles(sl && sl.lead); amts("leadAdd", s.leadAdd, sl && sl.lead ? sl.lead.equiv : null); }
    $("o-tv").innerHTML = vol(m ? m.tailVol / 1000 : null); $("o-tail").innerHTML = tiles(sl && sl.tail); amts("tailAdd", s.tailAdd, sl && sl.tail ? sl.tail.dry : null);
    var spm = sl ? sl.spMix : (P(s.spacerVol) != null ? P(s.spacerVol) + (P(s.spacerDead) || 0) : null);
    $("o-sp").innerHTML = '<p style="padding:12px 0 0;margin:0;color:var(--accent);font-weight:700;font-size:15px">Mix volume = ' + fx(spm) + ' m³ <span style="color:var(--sub);font-weight:400;font-size:13px">(pumped + dead)</span></p>';
    amts("spacerAdd", s.spacerAdd, spm);
  }
  bind(root, s, persist, draw, outs, {
    prev: function () { s.prevOn = !s.prevOn; persist(); draw(); },
    addAdd: function (key) { s[key].push({ name: "", factor: "", unit: "kg" }); persist(); draw(); },
    addPre: function (v) {
      var i = v.indexOf("|"), key = v.slice(0, i), nm = v.slice(i + 1);
      var c = chipList(key, s[key]).filter(function (x) { return x.name === nm; })[0]; if (!c) return;
      s[key].push({ name: nm, factor: c.d.factor || "", unit: c.d.unit || "kg" }); persist(); draw();
      var el = root.querySelector('[data-k="' + key + "." + (s[key].length - 1) + '.factor"]'); if (el && !el.value) el.focus();
    },
    delAdd: function (path) { var p = path.split("."); s[p[0]].splice(+p[1], 1); persist(); draw(); },
    pdf: function () { var m = model(s); if (!m || !m.items.length) { toast("Enter the job data first."); return; } showSheet(s, m); },
    dup: function () { var c = dupJob(s); location.hash = "job/" + c.id; toast("Duplicated"); },

function dupJob(s) {

}
function delJob(s, after) {

    db.jobs = db.jobs.filter(function (x) { return x.id !== s.id; }); saveDb(); toast(s.name + " deleted"); after();

  var qi = root.querySelector("#q"); if (qi) qi.addEventListener("input", function () { q.v = qi.value; root.querySelector("#list").innerHTML = list(); });
  root.addEventListener("click", function (e) {
    var mo = e.target.closest("[data-more]");
    if (mo) {
      var j = jobById(mo.getAttribute("data-more").split(":")[1]); if (!j) return;
      menu(j.name, [
        { label: "Open", fn: function () { location.hash = "job/" + j.id; } },
        { label: "Rename", fn: function () { form("Well number", [{ label: "Well number", value: j.name }], "Save", function (v) { if (!v[0]) return; j.name = v[0]; touch(j); route(); }); } },
        { label: "Duplicate", fn: function () { dupJob(j); route(); toast("Duplicated"); } },
        { label: "Delete", danger: true, fn: function () { delJob(j, route); } }]);
      return;
    }
    var g = e.target.closest("[data-go]"); if (g) { location.hash = g.getAttribute("data-go"); return; }
    if (e.target.getAttribute("data-a") === "create") create();
  });
}

/* ───────────────────────── shell ───────────────────────── */
function route() {
  var parts = (location.hash || "#home").slice(1).split("/");
  var root = document.getElementById("root");
  document.body.classList.remove("sheet");
  // A fresh node each time so listeners from the last page are dropped.
  var fresh = root.cloneNode(false); root.parentNode.replaceChild(fresh, root); root = fresh;
  window.scrollTo(0, 0);
  var j = parts[0] === "job" ? jobById(parts[1]) : null, body = document.createElement("div");
  if (j) {
    var top = document.createElement("div"); top.className = "top";
    top.innerHTML = "<button><b>‹</b><span>Home</span></button>";
    top.querySelector("button").onclick = function () { location.hash = "home"; };
    root.appendChild(top); CementPage(body, j);
  } else Home(body);
  root.appendChild(body);
}
window.addEventListener("hashchange", route);
window.addEventListener("error", function (e) {
  var t = document.getElementById("errbar");
  if (!t) { t = document.createElement("div"); t.id = "errbar"; t.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;font:12px -apple-system,sans-serif;padding:10px 14px;white-space:pre-wrap;"; document.body.appendChild(t); }
  t.textContent = "⚠ " + e.message + (e.lineno ? " @" + e.lineno : "");
});
route();
})();
</script>
<script>
// Offline is the point: the rig has no signal. Guarded on isSecureContext
// so opening the file straight off a phone still works.
if ('serviceWorker' in navigator && window.isSecureContext) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
