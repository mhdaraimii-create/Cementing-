<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cementing" />
<meta name="theme-color" content="#f2f2f7" />
<title>Cementing Toolkit</title>
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  /* Light, grouped-list look. Change these values and the whole app follows. */
  :root {
    --bg:#f2f2f7; --card:#ffffff; --line:#e5e5ea; --ink:#111114; --sub:#6c6c72; --faint:#a1a1a8;
    --field:#e9e9ee; --accent:#a5511f; --accent-bg:#fdf0e4; --accent-ink:#7c3a12;
    --danger:#c62828; --danger-bg:#fdecec; --danger-edge:#f4c7c7; --good:#1b7a4a; --good-bg:#e7f6ee;
    --lead:#d97706; --tail:#0f8a7e; --track:#7c3aed; --rat:#db2777; --disp:#2563eb;
    --r:14px;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin:0; padding:0; overflow-x:hidden; background:var(--bg); color:var(--ink);
    -webkit-text-size-adjust:100%; font-family:var(--font); }
  body, input, select, button { font-variant-numeric: tabular-nums; }
  input, select, button { font-family: inherit; color:var(--ink); }
  input::placeholder { color:var(--faint); }
  #root { min-height:100vh; }

  .page { max-width:600px; margin:0 auto; padding:0 16px calc(env(safe-area-inset-bottom) + 110px); }
  .top { position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    border-bottom:1px solid var(--line); }
  .top button { background:none; border:none; color:var(--accent); font-size:17px; cursor:pointer; display:flex; align-items:center; gap:4px; padding:4px; }
  .top button b { font-size:24px; font-weight:400; line-height:1; margin-top:-2px; }
  .title { font-size:34px; font-weight:800; letter-spacing:-.02em; margin:18px 0 4px; line-height:1.1; word-break:break-word; }
  .lede { color:var(--sub); font-size:15px; margin:0 0 6px; }

  .sec { margin-top:24px; }
  .sh { display:flex; align-items:flex-end; gap:8px; font-size:13px; font-weight:600; color:var(--sub); text-transform:uppercase;
    letter-spacing:.05em; padding:0 16px 7px; }
  .sh span { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; }
  .grp { background:var(--card); border-radius:var(--r); padding:0 16px; }
  .pad { padding:12px 0; }
  .r { display:flex; align-items:center; gap:12px; min-height:56px; padding:7px 0; border-bottom:1px solid var(--line); }
  .grp > .r:last-child, .grp > :last-child .r:last-child { border-bottom:none; }
  .r .l { flex:1; min-width:0; font-size:16px; }
  .r .l i { font-style:normal; color:var(--faint); font-size:14px; }
  .in { width:44%; max-width:200px; text-align:right; background:var(--field); border:2px solid transparent; border-radius:10px;
    padding:10px 12px; font-size:17px; min-width:0; -webkit-appearance:none; appearance:none; }
  .in:focus { outline:none; border-color:var(--accent); background:#fff; }
  .chip { background:var(--accent-bg); color:var(--accent); border:none; border-radius:10px; padding:10px 30px 10px 12px; font-size:16px;
    font-weight:600; max-width:60%; -webkit-appearance:none; appearance:none; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
  .chip:focus { outline:2px solid var(--accent); }
  .wide { width:100%; text-align:left; max-width:none; }

  .seg { display:flex; background:#e3e3e8; border-radius:11px; padding:3px; gap:3px; margin:12px 0; }
  .seg button { flex:1; border:none; background:transparent; color:var(--ink); padding:10px 6px; border-radius:9px; font-size:15px; font-weight:500; cursor:pointer; }
  .seg button.on { background:#fff; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.14); }
  .pill { border-radius:999px; padding:7px 15px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--sub); }
  .pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; white-space:nowrap; }
  .btn.sec2 { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.ghost { background:transparent; border:1.5px dashed #c7c7cc; color:var(--sub); width:100%; margin:4px 0 12px; }
  .btn.danger { background:var(--danger-bg); color:var(--danger); }
  .x { width:40px; height:40px; flex:0 0 40px; background:var(--danger-bg); border:1px solid var(--danger-edge); color:var(--danger); border-radius:10px; cursor:pointer; font-size:14px; }
  .bar2 { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .bar2 .btn { flex:1 1 auto; }

  .item { display:flex; align-items:center; gap:13px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer; width:100%;
    background:none; border-left:none; border-right:none; border-top:none; text-align:left; font-size:16px; }
  .grp > .item:last-child { border-bottom:none; }
  .item .ic { width:40px; height:40px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:17px; }
  .item .nm { display:block; font-size:17px; font-weight:500; }
  .item .sb { display:block; font-size:14px; color:var(--sub); margin-top:2px; }
  .item .ch { margin-left:auto; color:#c4c4c8; font-size:24px; font-weight:300; }

  .note { font-size:13px; color:var(--sub); margin:6px 0 0; line-height:1.45; }
  .warn { background:var(--danger-bg); border:1px solid var(--danger-edge); border-radius:12px; padding:12px 14px; margin-top:14px; color:var(--danger); font-size:14px; line-height:1.45; }
  .ok { background:var(--good-bg); border-radius:12px; padding:12px 14px; margin-top:10px; color:var(--good); font-size:14px; }
  .empty { text-align:center; color:var(--faint); padding:22px 0; font-size:15px; }

  .line { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .line .k { font-size:15px; display:flex; align-items:center; gap:11px; min-width:0; }
  .line .k small { display:block; font-size:13px; color:var(--sub); margin-top:2px; }
  .line .v { font-size:16px; font-weight:700; white-space:nowrap; }
  .num { width:28px; height:28px; border-radius:99px; color:#fff; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tag { font-size:15px; font-weight:700; margin:12px 0 0; display:flex; align-items:center; gap:7px; }
  .tag::before { content:""; width:12px; height:12px; border-radius:3px; background:currentColor; }
  .sum { display:flex; justify-content:space-between; padding:12px 0 4px; font-weight:700; font-size:15px; border-top:2px solid var(--line); }
  .big { border-radius:13px; padding:17px 16px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; background:var(--accent-bg); }
  .big .k { font-size:17px; font-weight:600; color:var(--accent-ink); }
  .big .v { font-size:28px; font-weight:800; letter-spacing:-.02em; }
  .big .v small { font-size:16px; font-weight:700; margin-left:3px; }
  .big.blue { background:#e8f0fd; } .big.blue .k { color:#1e4fa8; }
  .tiles { display:flex; gap:8px; margin:12px 0 6px; }
  .tile { flex:1; min-width:0; background:var(--bg); border-radius:12px; padding:11px 12px; }
  .tile .k { font-size:13px; color:var(--sub); font-weight:500; }
  .tile .v { font-size:22px; font-weight:800; margin-top:3px; letter-spacing:-.01em; }
  .tile .v small { font-size:12px; color:var(--sub); font-weight:600; margin-left:3px; }

  .add { padding:10px 0; border-bottom:1px solid var(--line); }
  .add .in { width:100%; max-width:none; text-align:left; font-size:16px; }
  .add .rw { display:flex; gap:7px; align-items:center; margin-top:7px; }
  .add .rw .in { flex:1; text-align:left; padding:10px; }
  .add .rw .chip { flex:1; max-width:none; font-size:15px; padding-right:26px; }
  .add .amt { flex:1.1; text-align:right; font-weight:700; font-size:15px; white-space:nowrap; }

  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); font-weight:600; padding:8px 4px; border-bottom:1px solid var(--line); }
  table.t td { padding:9px 4px; border-bottom:1px solid var(--line); }
  table.t tr:last-child td { border-bottom:none; }
  table.t td.n, table.t th.n { text-align:right; white-space:nowrap; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:90; display:flex; background:rgba(249,249,251,.94); backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px); border-top:1px solid #dcdce0; padding:6px 0 calc(env(safe-area-inset-bottom) + 6px); }
  .tabs button { flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:#8e8e93; font-size:12px; font-weight:500; cursor:pointer; padding:4px 0; }
  .tabs button.on { color:var(--accent); font-weight:600; }
  .tabs svg { width:28px; height:28px; }

  .foot { text-align:center; margin-top:34px; }
  .foot .nm { font-size:16px; font-weight:700; }
  .foot .ro { font-size:13px; color:var(--sub); margin-top:2px; }
  .foot a { display:inline-block; margin-top:6px; font-size:15px; color:var(--accent); text-decoration:none; }
  .linkbtn { background:none; border:none; color:var(--accent); font-size:14px; cursor:pointer; margin-top:8px; }

  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 86px); transform:translateX(-50%); z-index:9999;
    background:#1c1c1e; color:#fff; font-size:15px; font-weight:500; padding:11px 20px; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.25); white-space:nowrap; }

  .more { width:38px; height:38px; flex:0 0 38px; border-radius:99px; display:flex; align-items:center; justify-content:center;
    color:var(--sub); font-size:22px; font-weight:700; letter-spacing:1px; cursor:pointer; margin-left:auto; }
  .more:active { background:var(--field); }
  .more + .ch { margin-left:0; }
  .modal { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.38); display:flex; align-items:flex-end; justify-content:center;
    padding:0 10px calc(env(safe-area-inset-bottom) + 10px); animation:fade .15s ease-out; }
  .modal.mid { align-items:center; padding:20px; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  .sheetbox { width:100%; max-width:480px; }
  .sheetbox .grpm { background:rgba(255,255,255,.98); border-radius:14px; overflow:hidden; margin-bottom:8px; }
  .sheetbox .hdm { padding:13px 16px; text-align:center; font-size:13px; color:var(--sub); border-bottom:1px solid var(--line); }
  .sheetbox button { display:block; width:100%; background:none; border:none; border-bottom:1px solid var(--line); padding:17px; font-size:19px; color:#0a64d6; cursor:pointer; }
  .sheetbox button:last-child { border-bottom:none; }
  .sheetbox button.dg { color:var(--danger); } .sheetbox button.cx { font-weight:600; }
  .dlg { width:100%; max-width:340px; background:#fff; border-radius:16px; overflow:hidden; text-align:center; }
  .dlg .bd { padding:20px 18px 16px; }
  .dlg h4 { margin:0 0 6px; font-size:17px; } .dlg p { margin:0; font-size:14px; color:var(--sub); line-height:1.4; }
  .dlg .in { width:100%; max-width:none; text-align:left; margin-top:10px; font-size:16px; }
  .dlg .bt { display:flex; border-top:1px solid var(--line); }
  .dlg .bt button { flex:1; background:none; border:none; padding:14px; font-size:17px; color:#0a64d6; cursor:pointer; }
  .dlg .bt button + button { border-left:1px solid var(--line); font-weight:600; }
  .dlg .bt button.dg { color:var(--danger); }

  .ccrow { display:flex; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
  .grp > .ccrow:last-child { border-bottom:none; }
  .cc { flex:1; min-width:0; display:block; border:1.5px solid var(--line); border-radius:12px; padding:9px 11px 6px; background:var(--bg); }
  .cc .ct { display:flex; gap:6px; font-size:13px; color:var(--sub); }
  .cc .ct b { margin-left:auto; font-weight:600; color:var(--faint); font-size:12px; }
  .cc input { width:100%; border:none; background:none; font-size:20px; font-weight:600; padding:6px 0 2px; }
  .cc input:focus { outline:none; }
  .cc input::placeholder { color:var(--ink); opacity:.55; }
  .cc.ed { border-color:var(--good); background:#fff; } .cc.ed .ct b { color:var(--good); }
  .pchips { display:flex; flex-wrap:wrap; gap:7px; padding:10px 0 4px; }
  .pchip { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:8px 13px; font-size:14px; font-weight:600; cursor:pointer; }
  .pchip:active { background:var(--accent-bg); }

  /* Printable worksheet */
  #sheet { display:none; background:#fff; color:#141a17; min-height:100vh; }
  body.sheet #root { display:none; }
  body.sheet #sheet { display:block; }
  #sheet .tb { position:sticky; top:0; display:flex; gap:8px; align-items:center; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
    border-bottom:1px solid #e5e7e2; background:#f6f7f5; }
  #sheet .tb button { background:#fff; border:1px solid #e5e7e2; border-radius:10px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer; color:#141a17; }
  #sheet .tb .pr { margin-left:auto; background:var(--accent); color:#fff; border:none; }
  #sheet .doc { max-width:760px; margin:0 auto; padding:16px 14px 60px; font-size:10.5px; line-height:1.38; }
  #sheet h1 { font-size:17px; margin:0; } #sheet .sub { color:#6b7770; font-weight:400; }
  #sheet .hd { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #141a17; padding-bottom:5px; margin-bottom:8px; }
  #sheet .meta { text-align:right; font-size:9.5px; color:#444; }
  #sheet .cols { display:flex; gap:14px; align-items:flex-start; }
  #sheet .left { width:170px; flex-shrink:0; } #sheet .right { flex:1; min-width:0; }
  #sheet h2 { font-size:11.5px; color:var(--accent); margin:9px 0 3px; border-bottom:1px solid #eedccf; padding-bottom:2px; }
  #sheet table { width:100%; border-collapse:collapse; margin:2px 0 4px; }
  #sheet td, #sheet th { text-align:left; padding:2.5px 5px; border-bottom:1px solid #eee; vertical-align:top; }
  #sheet th { background:#f4f5f3; font-size:8.5px; text-transform:uppercase; letter-spacing:.3px; color:#666; }
  #sheet td.f { font-family:var(--mono); color:#666; font-size:9px; }
  #sheet td.r { text-align:right; font-family:var(--mono); font-weight:700; white-space:nowrap; }
  #sheet .tot td { background:#5a2a10; color:#fff; font-weight:700; border:none; }
  #sheet .totd td { background:#12233d; color:#fff; font-weight:700; border:none; }
  #sheet .fn { font-size:8.5px; color:#888; border-top:1px solid #ddd; padding-top:4px; margin-top:10px; }
  @media (max-width:600px){ #sheet .cols { flex-direction:column; } #sheet .left { width:100%; max-width:240px; } }
  @media print {
    @page { size:A4; margin:10mm; }
    #sheet .tb { display:none !important; }
    #sheet .doc { padding:0; max-width:none; }
    #sheet .cols { flex-direction:row; } #sheet .left { width:170px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="sheet"></div>
<script>
(function () {
"use strict";

/* ───────────────────────── storage ───────────────────────── */
// Everything lives on the phone. Every access is guarded: a private
// window or a locked-down browser must still run the calculators.
var NS = "cmt2.";
function load(k, d) { try { var v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { return false; } }

/* ───────────────────────── numbers ───────────────────────── */
var K = 0.506707;               // L/m per in² of diameter²  (π/4 · 0.0254² · 1000)
var G = 0.0980665;              // bar per m per SG
var PSI = 14.5038;              // psi per bar
var BBL = 6.28981;              // bbl per m³
function P(v) { if (v === "" || v == null) return null; var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
function cap(d) { return d > 0 ? d * d * K : null; }
function ann(D, d) { return D > 0 && d >= 0 && D > d ? (D * D - d * d) * K : null; }
function fx(v, n) { return v == null || !isFinite(v) ? "—" : Number(v).toFixed(n == null ? 2 : n); }
function fi(v) { return v == null || !isFinite(v) ? "—" : Math.round(v).toLocaleString("en-US"); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function hhmm(min) { if (min == null || !isFinite(min)) return "—"; var m = Math.round(min); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ───────────────────────── tubulars ───────────────────────── */
function frac(od) {
  var w = Math.floor(od + 1e-9), r = od - w, map = { 0: "", 0.125: "⅛", 0.25: "¼", 0.375: "⅜", 0.5: "½", 0.625: "⅝", 0.75: "¾", 0.875: "⅞" };
  var key = Math.round(r * 8) / 8; return w + (map[key] != null ? map[key] : r.toFixed(3).slice(1)) + "″";
}
// OD in, nominal weight lb/ft, ID in (API 5CT)
var CASING = [
  [30, 310, 28.000], [20, 94, 19.124], [20, 133, 18.730], [18.625, 87.5, 17.755], [16, 65, 15.250], [16, 75, 15.124], [16, 84, 15.010],
  [13.375, 54.5, 12.615], [13.375, 61, 12.515], [13.375, 68, 12.415], [13.375, 72, 12.347],
  [11.75, 54, 10.880], [11.75, 60, 10.772], [10.75, 45.5, 9.950], [10.75, 51, 9.850], [10.75, 55.5, 9.760],
  [9.625, 36, 8.921], [9.625, 40, 8.835], [9.625, 43.5, 8.755], [9.625, 47, 8.681], [9.625, 53.5, 8.535],
  [7.625, 26.4, 6.969], [7.625, 29.7, 6.875], [7.625, 33.7, 6.765],
  [7, 23, 6.366], [7, 26, 6.276], [7, 29, 6.184], [7, 32, 6.094], [7, 35, 6.004],
  [5.5, 15.5, 4.950], [5.5, 17, 4.892], [5.5, 20, 4.778], [5.5, 23, 4.670],
  [5, 15, 4.408], [5, 18, 4.276], [4.5, 11.6, 4.000], [4.5, 13.5, 3.920]
].map(function (c) { return { id: c[0] + "-" + c[1], od: c[0], w: c[1], idIn: c[2], label: frac(c[0]) + " " + c[1] + "#" }; });
var PIPE = [
  ["DP 5½″ 21.9#", 5.5, 4.778], ["DP 5″ 19.5#", 5, 4.276], ["DP 4½″ 16.6#", 4.5, 3.826], ["DP 4″ 14#", 4, 3.340],
  ["DP 3½″ 13.3#", 3.5, 2.764], ["DP 2⅞″ 10.4#", 2.875, 2.151], ["Tbg 4½″ 12.6#", 4.5, 3.958], ["Tbg 3½″ 9.3#", 3.5, 2.992],
  ["Tbg 2⅞″ 6.5#", 2.875, 2.441], ["Tbg 2⅜″ 4.7#", 2.375, 1.995]
].map(function (p) { return { id: p[0], label: p[0], od: p[1], idIn: p[2] }; });
var HOLES = [36, 26, 24, 22, 17.5, 16, 14.75, 12.25, 10.625, 9.875, 8.75, 8.5, 8.375, 6.5, 6.125, 6, 5.875, 4.75]
  .map(function (d) { return { id: String(d), d: d, label: frac(d) + " hole" }; });
function csg(id) { for (var i = 0; i < CASING.length; i++) if (CASING[i].id === id) return CASING[i]; return null; }
function pipe(id) { for (var i = 0; i < PIPE.length; i++) if (PIPE[i].id === id) return PIPE[i]; return null; }
function hole(id) { var d = P(id); return d ? { d: d, label: frac(d) } : null; }
// Most common weight per size, picked when only the size changes.

// Build the well model: every interval that gets slurry, and the displacement path.
function jobModel(s) {

  var err = [];

  if (c.od >= h.d) err.push("Casing OD " + frac(c.od) + " does not fit a " + frac(h.d) + " hole.");
  if (pc && c.od >= pc.idIn) err.push("Casing OD " + frac(c.od) + " is larger than the previous casing ID (" + pc.idIn + "″).");
  if (SH > TD) err.push("Shoe is deeper than TD.");
  if (FC >= SH) err.push("Float collar must be above the shoe.");
  if (TOC >= SH) err.push("TOC must be above the shoe.");
  if (PS != null && PS >= SH) err.push("Previous shoe must be above this shoe.");
  if (s.jobType === "liner") {
    if (LT == null) err.push("Enter the liner top.");
    else if (LT >= FC) err.push("Liner top must be above the float collar.");
    if (!pc) err.push("A liner hangs in a previous casing — pick its size.");
    else if (LT != null && PS != null && LT >= PS) err.push("Liner top should be inside the previous casing (above its shoe).");
  }
  if (lt && (tTop == null || tTop <= TOC || tTop >= SH)) err.push("Top of tail must sit between TOC and the shoe.");
  if (err.length) return { err: err };

  var capInt = P(s.capInt) || cap(c.idIn), capOH = P(s.capOH) || ann(h.d, c.od), capFull = P(s.capFull) || cap(h.d);
  var capCC = pc ? (P(s.capCC) || ann(pc.idIn, c.od)) : null;
  var capAL = pc && dp ? ann(pc.idIn, dp.od) : null;   // above a liner top, around the running string
  var ex = function (k) { return (P(s[k]) || 0) / 100; };

  var cuts = [TOC, SH]; [LT, PS, tTop].forEach(function (d) { if (d != null && d > TOC && d < SH) cuts.push(d); });
  cuts = cuts.filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(function (a, b) { return a - b; });
  var items = [];
  for (var i = 0; i < cuts.length - 1; i++) {
    var a = cuts[i], b = cuts[i + 1], geo, cp, cased;
    if (LT != null && b <= LT) { geo = "Above liner top (" + frac(pc.od) + "×" + (dp ? frac(dp.od) : "DP") + ")"; cp = capAL; cased = true; }
    else if (PS != null && b <= PS) { geo = "Csg-Csg (" + frac(pc.od) + "×" + frac(c.od) + ")"; cp = capCC; cased = true; }
    else { geo = "Open hole (" + frac(h.d) + "×" + frac(c.od) + ")"; cp = capOH; cased = false; }
    var sl = lt && b <= tTop ? "lead" : "tail";
    var e = sl === "lead" ? ex(cased ? "exLC" : "exLOH") : ex(cased ? "exTC" : "exTOH");
    items.push({ slurry: sl, label: geo, dTop: a, dBot: b, cap: cp, ex: e, vol: (b - a) * cp * (1 + e) });
  }
  items.push({ slurry: "shoetrack", label: "Shoe track (inside " + frac(c.od) + ")", dTop: FC, dBot: SH, cap: capInt, ex: 0, vol: (SH - FC) * capInt });
  if (TD > SH) items.push({ slurry: "rathole", label: "Rathole (" + frac(h.d) + " full bore)", dTop: SH, dBot: TD, cap: capFull, ex: ex("exTOH"), vol: (TD - SH) * capFull * (1 + ex("exTOH")) });
  items.forEach(function (z, i) { z.n = i + 1; });

  var leadL = 0, tailL = 0;
  items.forEach(function (z) { if (z.slurry === "lead") leadL += z.vol; else tailL += z.vol; });
  var parts = [];
  if (LT != null) {
    var dpCap = dp ? cap(dp.idIn) : null;
    parts.push({ t: (dp ? dp.label : "Running string") + "  0–" + LT + " m × " + fx(dpCap, 3), v: LT * dpCap });
    parts.push({ t: "Liner  " + LT + "–" + FC + " m × " + fx(capInt, 3), v: (FC - LT) * capInt });
  } else parts.push({ t: "Casing  0–" + FC + " m × " + fx(capInt, 3), v: FC * capInt });

    capInt: capInt, capOH: capOH, capCC: capCC, capFull: capFull, capTOC: capTOC,
    items: items, leadVol: leadL, tailVol: tailL, total: leadL + tailL, parts: parts, dispL: dispL, err: []

}

function slurryOf(V, y, conc, dead) {

}

}

function schematic(m, light) {
  if (!m || !m.items) return '<div class="note" style="text-align:center;padding:30px 0">Enter the well data to draw the job.</div>';
  var col = { lead: "#f59e0b", tail: light ? "#0d9488" : "#2dd4bf", shoetrack: "#a78bfa", rathole: "#f472b6" };
  var ink = light ? "#3a4741" : "#c9d3de", faint = light ? "#9aa89f" : "#5d6b7d", mud = light ? "#f2ede1" : "#1b2533", steel = light ? "#4a5560" : "#9fb0c3";

  var cx = 170, w = 24, U = 46, Pw = 52, csgTop = m.LT != null ? m.LT : 0, bot = Y(TD);
  var o = '<svg viewBox="0 0 330 ' + (bot + 24) + '" style="width:100%;height:auto;display:block" font-family="Archivo,-apple-system,sans-serif">';
  o += '<rect x="' + (cx - U) + '" y="' + T0 + '" width="' + 2 * U + '" height="' + (bot - T0) + '" fill="' + mud + '"/>';
  if (m.PS) o += '<rect x="' + (cx - Pw) + '" y="' + T0 + '" width="' + 2 * Pw + '" height="' + (Y(m.PS) - T0) + '" fill="' + mud + '"/>';

    else if (z.slurry === "rathole") o += '<rect x="' + (cx - U) + '" y="' + y1 + '" width="' + 2 * U + '" height="' + (y2 - y1) + '" fill="' + c + '" opacity=".9"/>';
    else {

      o += '<rect x="' + (cx + w) + '" y="' + y1 + '" width="' + (oo - w) + '" height="' + (y2 - y1) + '" fill="' + c + '" opacity=".9"/>';
    }

  if (m.LT != null) o += '<rect x="' + (cx - 5) + '" y="' + T0 + '" width="10" height="' + (Y(m.LT) - T0) + '" fill="#60a5fa" opacity=".35"/><line x1="' + (cx - 6) + '" y1="' + T0 + '" x2="' + (cx - 6) + '" y2="' + Y(m.LT) + '" stroke="' + steel + '" stroke-width="2"/><line x1="' + (cx + 6) + '" y1="' + T0 + '" x2="' + (cx + 6) + '" y2="' + Y(m.LT) + '" stroke="' + steel + '" stroke-width="2"/>';
  // hole wall (dashed) and previous casing (solid)
  var hTop = m.PS ? Y(m.PS) : T0;

  else o += '<rect x="' + (cx - 30) + '" y="' + (T0 - 8) + '" width="60" height="8" fill="' + steel + '"/>';

  o += '<text x="' + (cx + Pw + 14) + '" y="' + (T0 + 22) + '" font-size="9" fill="' + faint + '">' + frac(m.h.d) + " hole</text>";

function txt(label, k, s, ph) {

var PRESETS = [{ name: "WSW", u: "L" }, { name: "CDF-1", u: "L" }, { name: "CX-1", u: "kg" }, { name: "Bentonite", u: "kg" }, { name: "FL-45", u: "L" }, { name: "CSS-1", u: "kg" }];

  var push = function (n, d) { if (!have[n.toLowerCase()]) { have[n.toLowerCase()] = 1; out.push({ name: n, d: d }); } };
  Object.keys(lib).forEach(function (k) { if ((k.indexOf("S:") === 0) === sp) push(sp ? k.slice(2) : k, lib[k]); });

}

      '<div class="rw"><input class="in" inputmode="decimal" data-k="' + p + 'f" value="' + esc(r.f) + '" placeholder="factor">' +
      '<select class="chip" data-k="' + p + 'u">' + opt(units, r.u) + "</select>" +

  return h + '<p class="note">' + (isSpacer ? "Factor is kg or L per m³ of spacer mix." : "Factor is kg or L per MT — of dry cement, or of equivalent dry (the mix fluid you prepare, dead volume included).") + "</p>" +
    '<button class="btn ghost" data-act="addAdd" data-i="' + key + '">+ additive</button>';

function stagesFromJob(j) {
  var m = jobModel(j), r = P(j.rate) || 1;
  var st = [{ name: "Pressure test lines", vol: "", rate: "", extra: "10" }];
  if (P(j.spacerVol)) st.push({ name: "Spacer", vol: String(j.spacerVol), rate: String(r), extra: "" });
  st.push({ name: "Drop bottom plug", vol: "", rate: "", extra: "5" });
  if (m.items) {
    if (m.hasLead) st.push({ name: "Lead slurry", vol: fx(m.leadVol / 1000), rate: String(r), extra: "" });
    st.push({ name: m.hasLead ? "Tail slurry" : "Cement slurry", vol: fx(m.tailVol / 1000), rate: String(r), extra: "" });

function CementJob(root, w, s) {

      '<div class="tag" style="color:var(--tail)">' + (lt ? "Tail excess" : "Excess") + "</div>" + num(lt ? "Tail OH" : "Open hole", "exTOH", s, "%") + num(lt ? "Tail cased" : "Cased", "exTC", s, "%") +

        return "<tr><td>" + esc(r.x.name) + (r.stk ? '<div style="font-size:12px;color:var(--sub)">' + fi(r.stk) + " stk</div>" : "") + '</td><td class="n">' + (r.rt ? fx(r.rt * BBL, 1) : "—") +
          '</td><td class="n">' + fx(r.dt, 0) + '</td><td class="n">' + fx(r.cumV, 1) + '</td><td class="n">' + hhmm(r.cumT) + "</td></tr>";

    addPre: function (v) {
      var i = v.indexOf("|"), k = v.slice(0, i), n = v.slice(i + 1);

// Absolute-volume method per 1 MT of cement.
function sdCalc(s) {
  var cs = P(s.cemSG), wt = P(s.water); if (!cs || wt == null) return null;
  var mass = 1000 + wt * 10, vol = 1000 / cs + wt * 10, liqL = 0;
  s.adds.forEach(function (a) {
    var c = P(a.c), sg = P(a.sg); if (c == null || !sg) return;
    var kg, L;
    if (a.u === "bwoc") { kg = c * 10; L = kg / sg; } else if (a.u === "kgmt") { kg = c; L = kg / sg; } else { L = c; kg = c * sg; liqL += L; }
    mass += kg; vol += L;
  });
  var y = vol / 1000, sack = P(s.sack) || 50;
  return { sg: mass / vol, yield: y, mixFluid: (wt * 10 + liqL) / 1000, water: wt * 10 / 1000, sackKg: sack, perSack: y * sack };
}
function SlurryDesign(root, w) {
  var s = w.recipe;

  function draw() {
    var h = '<h1 class="title">Slurry design</h1><p class="lede">' + esc(w.name) + " · per 1 MT cement</p>";
    h += grp("Base", num("Cement SG", "cemSG", s, "", "3.15") + num("Water", "water", s, "% BWOC", "44") + num("Sack", "sack", s, "kg", "50"), "");
    h += '<p class="note" style="padding:0 16px">Class G neat: 44% water → 1.90 SG. Class A 46%, class H 38%.</p>';
    h += grp("Additives", s.adds.map(function (a, i) {
      var p = "adds." + i + ".";
      return '<div class="add"><input class="in" data-k="' + p + 'name" value="' + esc(a.name) + '" placeholder="Additive name">' +
        '<div class="rw"><input class="in" inputmode="decimal" data-k="' + p + 'c" value="' + esc(a.c) + '" placeholder="conc">' +
        '<select class="chip" data-k="' + p + 'u">' + units.map(function (u) { return '<option value="' + u.id + '"' + (a.u === u.id ? " selected" : "") + ">" + u.label + "</option>"; }).join("") + "</select>" +
        '<input class="in" inputmode="decimal" data-k="' + p + 'sg" value="' + esc(a.sg) + '" placeholder="SG">' +
        '<button class="x" data-act="del" data-i="' + i + '">✕</button></div></div>';
    }).join("") + '<p class="note">Liquids (L/MT) go into the mix fluid; solids add to the blend. SG is the absolute specific gravity.</p><button class="btn ghost" data-act="add">+ additive</button>');
    h += grp("Result", '<div id="o-r"></div>');
    h += grp("Send to a job", w.jobs.length ? sel("Job", "target", s, w.jobs.map(function (j) { return { id: j.id, label: jobLabel(j) }; })) +
      '<div class="bar2" style="margin:12px 0"><button class="btn" style="background:var(--lead)" data-act="to" data-i="lead">→ Lead</button><button class="btn" style="background:var(--tail)" data-act="to" data-i="tail">→ Tail / single</button></div>'
      : '<div class="empty">This well has no cement job yet.</div>');
    root.innerHTML = '<div class="page">' + h + "</div>"; outs();
  }
  function outs() {
    var r = sdCalc(s), o = root.querySelector("#o-r");
    if (!r) { o.innerHTML = '<div class="empty">Enter cement SG and water.</div>'; return; }
    o.innerHTML = '<div class="tiles">' + tile("Density", fx(r.sg, 3), "SG") + tile("Yield", fx(r.yield, 3), "m³/MT") + tile("Mix fluid", fx(r.mixFluid, 3), "m³/MT") + "</div>" +
      line("Density", fx(r.sg * 8.3454, 2) + " ppg · " + fi(r.sg * 1000) + " kg/m³") +
      line("Yield per " + r.sackKg + " kg sack", fx(r.perSack * 1000, 1) + " L · " + fx(r.perSack * 35.3147, 3) + " ft³") +
      line("Water only", fx(r.water, 3) + " m³/MT") +
      line("Gradient", fx(r.sg * G, 4) + " bar/m · " + fx(r.sg * 0.4335, 3) + " psi/ft");
  }
  bind(root, s, persist, draw, outs, {
    add: function () { s.adds.push({ name: "", c: "", u: "bwoc", sg: "" }); persist(); draw(); },
    del: function (i) { s.adds.splice(+i, 1); persist(); draw(); },
    to: function (which) {
      var r = sdCalc(s), j = w.jobs.filter(function (x) { return x.id === s.target; })[0]; if (!r || !j) return;
      j[which + "SG"] = r.sg.toFixed(2); j[which + "Yield"] = r.yield.toFixed(3); j[which + "Conc"] = r.mixFluid.toFixed(3);
      if (which === "lead") j.slurry = "leadtail";
      touch(w); toast("Sent to " + which + " · " + jobLabel(j));
    }
  });
  draw();
}

/* ═════════════════════════ BALANCED PLUG ═════════════════════════ */
function PlugTool(root, w, s) {
  function persist() { touch(w); }
  function draw() {
    var h = '<h1 class="title">Balanced plug</h1><p class="lede">' + esc(w.name) + "</p>";
    h += '<div class="bar2"><button class="btn danger" data-act="del">Delete plug</button></div>';
    h += grp("Plug", txt("Name", "title", s, "e.g. Kick-off plug") + '<div class="pad" style="padding-top:0">' + seg("where", s, [["oh", "Open hole"], ["cased", "Inside casing"]]) + "</div>" +
      (s.where === "oh" ? sel("Hole", "holeSize", s, HOLES, true) + num("Excess", "ex", s, "%") : csgRows("Casing", "csgSize", s)) +
      num("Plug bottom", "bottom", s, "m") + num("Plug length", "len", s, "m") + sel("Work string", "pipe", s, PIPE, true) +
      num("Spacer ahead", "spAhead", s, "m³") + num("Under-displace", "under", s, "m³", "0"));
    h += grp("Result", '<div id="o-p"></div>');
    h += grp("Cement", num("Slurry yield", "yield", s, "m³/MT") + num("Mix fluid", "conc", s, "m³/MT") + num("Pump output", "pumpOut", s, "L/stk") + '<div id="o-p2"></div>');
    root.innerHTML = '<div class="page">' + h + "</div>"; outs();
  }
  function outs() {
    var D = s.where === "oh" ? P(s.holeSize) : (csg(s.csgSize) || {}).idIn, pp = pipe(s.pipe), B = P(s.bottom), L = P(s.len), ex = s.where === "oh" ? (P(s.ex) || 0) / 100 : 0;
    var o = root.querySelector("#o-p"), o2 = root.querySelector("#o-p2");
    if (!D || !pp || B == null || !L) { o.innerHTML = '<div class="empty">Enter plug bottom, length and the work string.</div>'; o2.innerHTML = ""; return; }
    if (L > B) { o.innerHTML = '<div class="warn" style="margin:12px 0">⚠ The plug is longer than its bottom depth.</div>'; o2.innerHTML = ""; return; }
    var hc = cap(D), pc = cap(pp.idIn), ac = ann(D, pp.od);
    var V = L * hc * (1 + ex) / 1000, Hp = V * 1000 / (ac + pc), topIn = B - Hp, topOut = B - V * 1000 / hc;
    var spH = (P(s.spAhead) || 0) * 1000 / ac, spBehind = spH * pc / 1000;
    var disp = Math.max(0, pc * (topIn - spH) / 1000 - (P(s.under) || 0)), po = P(s.pumpOut);
    o.innerHTML = '<div class="tiles">' + tile("Cement", fx(V), "m³") + tile("Spacer behind", fx(spBehind), "m³") + tile("Displace", fx(disp), "m³") + "</div>" +
      line("Hole / annulus / pipe", fx(hc) + " / " + fx(ac) + " / " + fx(pc), "capacities, L/m") +
      line("Plug height, pipe in", fi(Hp) + " m", "V ÷ (annulus + pipe capacity)") +
      line("Top of cement, pipe in", fi(topIn) + " m") +
      line("Top of cement, pipe out", fi(topOut) + " m", "pull above this before circulating", "var(--accent)") +
      line("Spacer height (balanced)", fi(spH) + " m") +
      line("Displacement", fx(disp) + " m³ · " + fx(disp * BBL, 1) + " bbl", P(s.under) ? "under-displaced by " + esc(s.under) + " m³" : "balanced") +
      (po ? line("Strokes", fi(disp * 1000 / po) + " stk") : "");
    var y = P(s.yield), cc = P(s.conc);
    o2.innerHTML = y ? '<div class="tiles" style="margin-bottom:14px">' + tile("Dry cement", fx(V / y), "MT") + tile("Mix fluid", cc ? fx(V / y * cc) : "—", "m³") + tile("Sacks", fi(V / y * 1000 / 50), "× 50 kg") + "</div>" : "";
  }
  bind(root, s, persist, draw, outs, {
    del: function () { ask("Delete this plug?", "", "Delete", true, function () { w.plugs = w.plugs.filter(function (x) { return x.id !== s.id; }); touch(w); toast("Plug deleted"); location.hash = "well/" + w.id; }); }
  });
  draw();
}

/* ═════════════════════════ TOOLS ═════════════════════════ */
function ToolsPage(root) {
  var h = '<div class="page"><div style="height:calc(env(safe-area-inset-top) + 14px)"></div><h1 class="title">Tools</h1><p class="lede">Quick calculators — not tied to a well.</p>';
  h += grp("Calculators", item('data-go="caps"', "#0d9488", "C", "Capacities", "Hole, casing, annulus — L/m") + item('data-go="units"', "#7c3aed", "U", "Converter", "SG · ppg · bar · psi · bbl · m³"));
  h += grp("Backup", '<div class="bar2" style="margin:12px 0"><button class="btn sec2" data-a="export">Save a copy</button><label class="btn sec2" style="text-align:center">Restore<input type="file" accept=".json,application/json" data-a="import" style="display:none"></label></div>' +
    '<p class="note" style="padding-bottom:12px">Your wells live on this phone only. Save a copy to keep them safe or move them to another phone.</p>');
  root.innerHTML = h + "</div>";
  root.addEventListener("click", function (e) {
    var g = e.target.closest("[data-go]"); if (g) { location.hash = g.getAttribute("data-go"); return; }
    if (e.target.getAttribute("data-a") === "export") {
      var data = { app: "cementing-toolkit", v: 2, at: new Date().toISOString(), wells: db.wells, me: load("me", {}) };
      var blob = new Blob([JSON.stringify(data)], { type: "application/json" }), url = URL.createObjectURL(blob), el = document.createElement("a");
      el.href = url; el.download = "cementing-backup-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(el); el.click();
      setTimeout(function () { URL.revokeObjectURL(url); el.remove(); }, 500);
    }
  });
  root.addEventListener("change", function (e) {
    if (e.target.getAttribute("data-a") !== "import") return;
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (d.app !== "cementing-toolkit" || !Array.isArray(d.wells)) { toast("That is not a Cementing Toolkit backup."); return; }
        var n = 0;
        d.wells.forEach(function (w) {
          var i = db.wells.findIndex(function (x) { return x.id === w.id; });
          if (i < 0) { db.wells.push(w); n++; } else if ((w.updated || 0) > (db.wells[i].updated || 0)) { db.wells[i] = w; n++; }
        });
        saveDb(); if (d.me && !load("me", {}).name) save("me", d.me);
        toast("Restored " + n + " well" + (n === 1 ? "" : "s"));
      } catch (x) { toast("Could not read that file."); }
    };
    rd.readAsText(f);
  });
}

var capS = Object.assign({ outer: "hole", oHole: "12.25", oCsg: "9.625-47", oMan: "", inner: "csg", iCsg: "9.625-47", iPipe: "DP 5″ 19.5#", iMan: "", len: "1000" }, load("cap", {}));
function CapTool(root) {
  var s = capS;
  function persist() { save("cap", s); }
  function draw() {
    var h = '<h1 class="title">Capacities</h1>';
    h += grp("Outside", '<div class="pad" style="padding-bottom:0">' + seg("outer", s, [["hole", "Hole"], ["csg", "Casing ID"], ["man", "Manual"]]) + "</div>" +
      (s.outer === "hole" ? sel("Hole", "oHole", s, HOLES, true) : s.outer === "csg" ? csgRows("Casing", "oCsg", s) : num("Diameter", "oMan", s, "in")));
    h += grp("Inside", '<div class="pad" style="padding-bottom:0">' + seg("inner", s, [["none", "Empty"], ["csg", "Casing"], ["pipe", "DP/Tbg"], ["man", "Manual"]]) + "</div>" +
      (s.inner === "csg" ? csgRows("Casing", "iCsg", s) : s.inner === "pipe" ? sel("String", "iPipe", s, PIPE, true) : s.inner === "man" ? num("Diameter", "iMan", s, "in") : ""));
    h += grp("Result", num("Length", "len", s, "m") + '<div id="o-c"></div>');
    h += grp("Casing table", '<div class="pad"><table class="t"><tr><th>Size</th><th class="n">ID in</th><th class="n">L/m</th></tr>' +
      CASING.map(function (c) { return "<tr><td>" + c.label + '</td><td class="n">' + c.idIn.toFixed(3) + '</td><td class="n">' + fx(cap(c.idIn)) + "</td></tr>"; }).join("") + "</table></div>");
    root.innerHTML = '<div class="page">' + h + "</div>"; outs();
  }
  function outs() {
    var D = s.outer === "hole" ? P(s.oHole) : s.outer === "csg" ? (csg(s.oCsg) || {}).idIn : P(s.oMan);
    var d = s.inner === "none" ? 0 : s.inner === "csg" ? (csg(s.iCsg) || {}).od : s.inner === "pipe" ? (pipe(s.iPipe) || {}).od : P(s.iMan);
    var o = root.querySelector("#o-c"), L = P(s.len);
    if (!D || d == null) { o.innerHTML = '<div class="empty">Pick both sizes.</div>'; return; }
    if (d >= D) { o.innerHTML = '<div class="warn" style="margin:12px 0">⚠ ' + d + "″ does not fit inside " + D + "″.</div>"; return; }
    var c = ann(D, d), pIn = s.inner === "pipe" ? cap((pipe(s.iPipe) || {}).idIn) : s.inner === "csg" ? cap((csg(s.iCsg) || {}).idIn) : null;
    o.innerHTML = '<div class="tiles">' + tile(d ? "Annulus" : "Capacity", fx(c, 3), "L/m") + tile("Volume", L ? fx(c * L / 1000) : "—", "m³") + "</div>" +
      line("bbl/ft", fx(c / 1000 * BBL * 0.3048, 5)) + line("m per m³", fx(1000 / c, 1)) + line("Formula", "(" + D + "² − " + d + "²) × 0.5067") +
      (pIn ? line("Inside the pipe", fx(pIn, 3) + " L/m" + (L ? " · " + fx(pIn * L / 1000) + " m³" : "")) : "");
  }
  bind(root, s, persist, draw, outs, {});
  draw();
}

var CONV = [
  { t: "Density", u: [["SG", 1], ["ppg", 1 / 8.3454], ["kg/m³", 0.001], ["psi/ft", 1 / 0.4335], ["bar/m", 1 / G]] },
  { t: "Pressure", u: [["bar", 1], ["psi", 1 / PSI], ["kPa", 0.01], ["MPa", 10]] },
  { t: "Volume", u: [["m³", 1], ["bbl", 1 / BBL], ["L", 0.001], ["ft³", 0.0283168], ["gal (US)", 0.00378541]] },
  { t: "Rate", u: [["m³/min", 1], ["bpm", 1 / BBL], ["L/min", 0.001], ["gpm", 0.00378541]] },
  { t: "Length", u: [["m", 1], ["ft", 0.3048], ["in", 0.0254]] },
  { t: "Yield", u: [["m³/MT", 1], ["L/kg", 1], ["ft³/sk (94 lb)", 1 / (35.3147 * 0.042638)]] },
  { t: "Capacity", u: [["L/m", 1], ["m³/m", 1000], ["bbl/ft", 1000 / (BBL * 0.3048)]] }
];
var cv = Object.assign({ cat: "0", val: {} }, load("cv", {}));
function ConvTool(root) {
  function draw() {
    var c = CONV[+cv.cat] || CONV[0];
    var h = '<h1 class="title">Converter</h1><div class="seg" style="flex-wrap:wrap">' + CONV.map(function (x, i) {
      return '<button data-cat="' + i + '" class="' + (String(i) === String(cv.cat) ? "on" : "") + '" style="flex:1 0 28%">' + x.t + "</button>";
    }).join("") + "</div>";
    h += grp(c.t, c.u.map(function (u, i) {
      return '<label class="r"><span class="l">' + u[0] + '</span><input class="in" inputmode="decimal" data-cv="' + i + '"></label>';
    }).join(""), "type in any box");
    root.innerHTML = '<div class="page">' + h + "</div>";
    var inputs = root.querySelectorAll("[data-cv]");
    var fill = function (b, skip) { inputs.forEach(function (el, i) { if (i !== skip) el.value = b == null ? "" : +(b / c.u[i][1]).toPrecision(6); }); };
    fill(cv.val[cv.cat], -1);
    inputs.forEach(function (el, i) {
      el.addEventListener("input", function () { var v = P(el.value), b = v == null ? null : v * c.u[i][1]; cv.val[cv.cat] = b; save("cv", cv); fill(b, i); });
    });
  }
  root.addEventListener("click", function (e) { var b = e.target.closest("[data-cat]"); if (b) { cv.cat = b.getAttribute("data-cat"); save("cv", cv); draw(); } });
  draw();
}

/* ═════════════════════════ SHELL ═════════════════════════ */
var ICON = {
  wells: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 4h16M8 4v20M20 4v20M12 4v20M16 4v20M5 24h18"/></svg>',
  cement: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="6" width="20" height="16" rx="1.5"/><path d="M4 11.3h20M4 16.6h20M10 6v5.3M18 6v5.3M14 11.3v5.3M8 16.6V22M20 16.6V22"/></svg>',
  tools: '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="18" height="20" rx="2.5"/><path d="M9 8.5h10M9.5 13.5h1M14 13.5h1M18.5 13.5h.5M9.5 17.5h1M14 17.5h1M18.5 17.5h.5M9.5 21h1M14 21h1"/></svg>'
};
function route() {
  var parts = (location.hash || "#wells").slice(1).split("/"), page = parts[0] || "wells";
  var root = document.getElementById("root");
  document.body.classList.remove("sheet");
  // A fresh node each time so listeners from the last page are dropped.
  var fresh = root.cloneNode(false); root.parentNode.replaceChild(fresh, root); root = fresh;
  window.scrollTo(0, 0);
  var w = parts[1] ? wellById(parts[1]) : null, tab = "wells", back = null, body = document.createElement("div");
  var find = function (arr, id) { return (arr || []).filter(function (x) { return x.id === id; })[0]; };
  if (page === "well" && w) { tab = "cement"; back = ["wells", "Wells"]; WellPage(body, w); }
  else if (page === "job" && w && find(w.jobs, parts[2])) { tab = "cement"; back = ["well/" + w.id, w.name]; CementJob(body, w, find(w.jobs, parts[2])); }
  else if (page === "plug" && w && find(w.plugs, parts[2])) { tab = "cement"; back = ["well/" + w.id, w.name]; PlugTool(body, w, find(w.plugs, parts[2])); }
  else if (page === "slurry" && w) { tab = "cement"; back = ["well/" + w.id, w.name]; SlurryDesign(body, w); }
  else if (page === "tools") { tab = "tools"; ToolsPage(body); }
  else if (page === "caps") { tab = "tools"; back = ["tools", "Tools"]; CapTool(body); }
  else if (page === "units") { tab = "tools"; back = ["tools", "Tools"]; ConvTool(body); }
  else WellsHome(body);
  if (back) {
    var top = document.createElement("div"); top.className = "top";
    top.innerHTML = '<button><b>‹</b><span></span></button>'; top.querySelector("span").textContent = back[1];
    top.querySelector("button").onclick = function () { location.hash = back[0]; };
    root.appendChild(top);
  }
  root.appendChild(body);
  var tabs = document.createElement("nav"); tabs.className = "tabs";
  tabs.innerHTML = [["wells", "Wells"], ["cement", "Cement"], ["tools", "Tools"]].map(function (t) {
    return '<button data-tab="' + t[0] + '" class="' + (tab === t[0] ? "on" : "") + '">' + ICON[t[0]] + "<span>" + t[1] + "</span></button>";
  }).join("");
  tabs.onclick = function (e) {
    var b = e.target.closest("[data-tab]"); if (!b) return;
    var t = b.getAttribute("data-tab");
    if (t === "cement") { var c = curWell(); if (c) location.hash = "well/" + c.id; else { toast("Create a well first"); location.hash = "wells"; } }
    else location.hash = t;
  };
  root.appendChild(tabs);
}
window.addEventListener("hashchange", route);
window.addEventListener("error", function (e) {
  var t = document.getElementById("errbar");
  if (!t) { t = document.createElement("div"); t.id = "errbar"; t.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#b91c1c;color:#fff;font:12px -apple-system,sans-serif;padding:10px 14px;white-space:pre-wrap;"; document.body.appendChild(t); }
  t.textContent = "⚠ " + e.message + (e.lineno ? " @" + e.lineno : "");
});
route();
})();
</script>
<script>
// Offline is the point: the rig has no signal. Guarded on isSecureContext
// so opening the file straight off a phone still works.
if ('serviceWorker' in navigator && window.isSecureContext) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
